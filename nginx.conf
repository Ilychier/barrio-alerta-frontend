# ============================================================
# Nginx — Barrio Alerta Frontend (Producción)
# Sirve el build estático de Expo (React Native Web)
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ============================================================
    # Seguridad
    # ============================================================
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ============================================================
    # SPA — Servir estáticos si existen, si no index.html
    # Esta única regla maneja TODO: _expo/, assets/, icons/, etc.
    # ============================================================
    location / {
        try_files $uri $uri/ /index.html;
        # HTML SIN cache: el navegador siempre revalida con el servidor
        # (If-Modified-Since → 304 si no cambió). Sin esto, el navegador
        # aplica caching heurístico y los usuarios ven versiones viejas
        # durante días tras un deploy.
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ============================================================
    # Assets con hash (Expo) — inmutables: cachear para siempre.
    # El hash en el nombre garantiza que un cambio genera un archivo
    # nuevo; el viejo nunca se reutiliza (cache busting natural).
    # ============================================================
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /_expo/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ============================================================
    # Gzip
    # ============================================================
    gzip on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # ============================================================
    # Bloquear archivos ocultos
    # ============================================================
    location ~ /\. {
        deny all;
    }
}