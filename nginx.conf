# ============================================================
# Nginx — Barrio Alerta Frontend (Producción)
# Sirve el build estático de Expo (React Native Web)
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ============================================================
    # Seguridad
    # ============================================================
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ============================================================
    # SPA — Servir estáticos si existen, si no index.html
    # Esta única regla maneja TODO: _expo/, assets/, icons/, etc.
    # ============================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ============================================================
    # Gzip
    # ============================================================
    gzip on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # ============================================================
    # Bloquear archivos ocultos
    # ============================================================
    location ~ /\. {
        deny all;
    }
}